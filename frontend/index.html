<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#08304F" />

    <!-- Primary SEO tags -->
    <title>StayNex — Student Hostel Booking</title>
    <meta name="description" content="Find and book student hostels in minutes. Browse rooms, lock in your bed with a flexible deposit, and manage your booking online with StayNex." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://staynex.vercel.app/" />

    <!-- Open Graph / Facebook, WhatsApp link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="StayNex" />
    <meta property="og:title" content="StayNex — Student Hostel Booking" />
    <meta property="og:description" content="Find and book student hostels in minutes. Browse rooms, lock in your bed with a flexible deposit, and manage your booking online." />
    <meta property="og:url" content="https://staynex.vercel.app/" />
    <meta property="og:image" content="https://staynex.vercel.app/og-image.png" />

    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="StayNex — Student Hostel Booking" />
    <meta name="twitter:description" content="Find and book student hostels in minutes." />
    <meta name="twitter:image" content="https://staynex.vercel.app/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <!-- Structured data: helps Google understand what StayNex is -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "StayNex",
      "description": "Student hostel booking platform.",
      "url": "https://staynex.vercel.app/"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
